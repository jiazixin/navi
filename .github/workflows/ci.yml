name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Exact Node.js patch release (security fixes); keep within web/package.json engines.
env:
  NODE_VERSION: 24.22.1

# Actions are pinned by commit; the comment names the reviewed tag.
jobs:
  web:
    name: Web 检查、测试与构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run format:check
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test
      - run: npm --prefix web run build
      - run: npm --prefix web run storybook:test
      - run: npm --prefix web audit --audit-level=high --omit=dev
      - run: npm --prefix web audit --audit-level=high

  go:
    name: Go 检查与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The Go embed package needs web/dist before any vet, test or build.
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run build
      - run: go mod verify
      - run: go mod tidy -diff
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
      - name: goimports
        run: |
          unformatted=$(go run golang.org/x/tools/cmd/goimports@v0.50.0 -local navi -l $(git ls-files '*.go'))
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: GOOS=linux GOARCH=arm64 go vet ./...
      - run: GOOS=darwin GOARCH=amd64 go vet ./...
      - run: GOOS=darwin GOARCH=arm64 go vet ./...
      - run: go vet -tags integration,scale ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: npm --prefix web ci --ignore-scripts
      - name: 安装 Chromium
        working-directory: web
        run: npm exec -- playwright install --with-deps chromium
      # Visual baselines run separately in the pinned Linux container.
      - name: Vite fixture E2E
        working-directory: web
        run: npm exec -- playwright test --project=chromium
      # The production suite builds and runs the real Go binary with web/dist embedded.
      - run: npm --prefix web run build
      - name: 生产集成 E2E
        working-directory: web
        run: npm exec -- playwright test --config playwright.production.config.ts --project=production-chromium

  release-snapshot:
    name: GoReleaser 多目标快照构建
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - run: goreleaser check
      - run: goreleaser release --snapshot --clean

  visual:
    name: Linux ARM64 visual regression
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run test:visual -- --workers=2
